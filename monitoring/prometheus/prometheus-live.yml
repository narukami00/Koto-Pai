# Prometheus scrape configuration for the LIVE site on Render.
# Used by docker-compose.live-monitoring.yml (runs on your machine, watches https://koto-pai-aatd.onrender.com).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kotopai
    metrics_path: /actuator/prometheus
    scheme: https
    basic_auth:
      username: prometheus
      # Written at container start from LIVE_METRICS_PASSWORD (the METRICS_PASSWORD set on Render).
      password_file: /tmp/metrics_password
    static_configs:
      - targets: ["koto-pai-aatd.onrender.com:443"]
        labels:
          environment: production
