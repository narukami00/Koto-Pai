# Prometheus scrape configuration for Koto Pai.
# Started only with: docker compose --profile monitoring up --build
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: kotopai
    metrics_path: /actuator/prometheus
    scheme: http
    basic_auth:
      username: prometheus
      # Written at container start from the METRICS_PASSWORD environment variable (see docker-compose.yml).
      password_file: /tmp/metrics_password
    static_configs:
      - targets: ["app:8080"]
        labels:
          environment: local

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
