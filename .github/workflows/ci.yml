name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

# Cancel an older run of the same branch/PR when a new commit arrives
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run unit tests (Surefire) with coverage
        run: ./mvnw -B test

      - name: Test summary
        if: always()
        run: |
          echo "### Unit tests" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/surefire-reports/*.txt >> "$GITHUB_STEP_SUMMARY" || echo "No unit test reports found" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: target/surefire-reports/

      - name: Upload unit coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-coverage
          path: target/site/jacoco/

  integration-tests:
    name: Integration tests
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Run integration tests (Failsafe) with coverage
        run: ./mvnw -B verify -DskipUTs=true

      - name: Test summary
        if: always()
        run: |
          echo "### Integration tests" >> "$GITHUB_STEP_SUMMARY"
          grep -h "Tests run" target/failsafe-reports/*.txt >> "$GITHUB_STEP_SUMMARY" || echo "No integration test reports found" >> "$GITHUB_STEP_SUMMARY"

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-test-reports
          path: target/failsafe-reports/

      - name: Upload integration coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-coverage
          path: target/site/jacoco-it/
