<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Activity', 'activity', ~{::main})}">
<head>
  <title>Activity · Koto Pai</title>
</head>
<body>
<main class="dashboard">
  <header class="page-head"><div><a class="back" th:href="@{/ledger}">← Balances</a><h1>Activity</h1><p class="muted">The complete timeline.</p></div></header>
  <form class="filter-bar" method="get" th:action="@{/activity}">
    <label>Friend ID<input type="number" min="1" name="friendId" th:value="${selectedFriendId}" placeholder="Any friend"></label>
    <label>Type<select name="type"><option value="">All activity</option><option th:each="kind : ${types}" th:value="${kind}" th:text="${kind}" th:selected="${kind == selectedType}">TYPE</option></select></label>
    <button class="button secondary" type="submit">Filter</button>
  </form>
  <section class="card timeline-list">
    <p class="empty" th:if="${#lists.isEmpty(activities)}">No matching activity yet.</p>
    <article class="timeline-row" th:each="event : ${activities}">
      <span class="timeline-dot"></span>
      <div><b th:text="${event.description}">Activity</b><small th:text="${#strings.capitalize(#strings.replace(#strings.toLowerCase(event.type), '_', ' ')) + ' · ' + #strings.replace(#strings.substring(event.createdAt.toString(), 0, 16), 'T', ' ') + ' UTC'}">TYPE</small></div>
      <strong th:if="${event.amount != null}" th:text="${'৳' + event.amount}">৳0.00</strong>
    </article>
  </section>
</main>
</body>
</html>
