<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Friend history', 'home', ~{::main})}">
<head>
  <title>Friend history · Koto Pai</title>
</head>
<body>
  <main class="dashboard">
    <header class="page-head">
      <div>
        <a class="back" th:href="@{/ledger}">← Balances</a>
        <h1 th:text="${'History with ' + @people.nameOf(friendId)}">Friend history</h1>
      </div>
    </header>

    <section class="card history-list">
      <p th:if="${#lists.isEmpty(history)}" class="empty">No debt history with this friend.</p>
      <article class="history-row" th:each="debt : ${history}">
        <div>
          <b th:text="${debt.debtorId == userId ? 'You → ' + @people.nameOf(friendId) : @people.nameOf(friendId) + ' → You'}">Direction</b>
          <small th:text="${debt.origin + (debt.outingId == null ? '' : ' · Outing #' + debt.outingId)}">OUTING</small>
        </div>
        <div class="history-money">
          <b th:text="${'৳' + debt.amount}">৳0.00</b>
          <span class="tag" th:classappend="${debt.status.name() == 'PAID' ? ' ok' : ''}" th:text="${debt.status}">OPEN</span>
        </div>
      </article>
    </section>

    <section class="section-block">
      <div class="section-title"><h2>Everything between you</h2><span th:text="${#lists.size(activities) + ' events'}">0 events</span></div>
      <div class="card timeline-list">
        <p th:if="${#lists.isEmpty(activities)}" class="empty">No payment, dispute or delegation activity yet.</p>
        <article class="timeline-row" th:each="event : ${activities}">
          <span class="timeline-dot"></span>
          <div><b th:text="${event.description}">Activity</b><small th:text="${#strings.capitalize(#strings.replace(#strings.toLowerCase(event.type), '_', ' ')) + ' · ' + #strings.replace(#strings.substring(event.createdAt.toString(), 0, 16), 'T', ' ') + ' UTC'}">TYPE</small></div>
          <strong th:if="${event.amount != null}" th:text="${'৳' + event.amount}">৳0.00</strong>
        </article>
      </div>
    </section>
  </main>
</body>
</html>
