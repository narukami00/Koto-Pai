<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — Koto Pai</title>
  <link rel="stylesheet" th:href="@{/css/kotopai.css}">
  <style>
    .auth-card { max-width: 420px; margin: 40px auto; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--teal); }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; background: #fff; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 2px rgba(24, 96, 75, .15); }
    .auth-btn { width: 100%; padding: 12px; background: var(--teal); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .auth-btn:hover { background: var(--teal-d); }
    .auth-footer { margin-top: 20px; text-align: center; font-size: 14px; }
    .auth-footer a { color: var(--orange-ink); font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .banner.error { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; font-weight: 600; background: #ffebee; color: #c62828; }
    .field-error { color: #c62828; font-size: 12px; margin-top: 4px; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card auth-card">
      <h1 class="brand">Koto <span>Pai?</span></h1>
      <p class="muted">Create an account to start tracking expenses.</p>

      <div th:if="${registrationError}" class="banner error" th:text="${registrationError}">
        Registration failed.
      </div>

      <form th:action="@{/register}" th:object="${registerRequest}" method="post">
        <div class="form-group">
          <label for="userCode">User ID (public code)</label>
          <input type="text" id="userCode" th:field="*{userCode}" class="form-control" placeholder="e.g. rafsan10" required autofocus>
          <div th:if="${#fields.hasErrors('userCode')}" th:errors="*{userCode}" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="displayName">Full Name</label>
          <input type="text" id="displayName" th:field="*{displayName}" class="form-control" placeholder="e.g. Rafsan Riasat" required>
          <div th:if="${#fields.hasErrors('displayName')}" th:errors="*{displayName}" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" th:field="*{email}" class="form-control" placeholder="e.g. rafsan@example.com" required>
          <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="field-error"></div>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" th:field="*{password}" class="form-control" placeholder="At least 6 characters" required>
          <div th:if="${#fields.hasErrors('password')}" th:errors="*{password}" class="field-error"></div>
        </div>

        <button type="submit" class="auth-btn">Create Account</button>
      </form>

      <div class="auth-footer">
        Already have an account? <a th:href="@{/login}">Log in</a>
      </div>
    </div>
  </main>
</body>
</html>
