<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login — Koto Pai</title>
  <link rel="stylesheet" th:href="@{/css/kotopai.css}">
  <style>
    .auth-card { max-width: 420px; margin: 40px auto; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 6px; color: var(--teal); }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid var(--line); border-radius: 10px; font-size: 15px; background: #fff; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--teal); box-shadow: 0 0 0 2px rgba(24, 96, 75, .15); }
    .auth-btn { width: 100%; padding: 12px; background: var(--teal); color: #fff; border: none; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 10px; }
    .auth-btn:hover { background: var(--teal-d); }
    .auth-footer { margin-top: 20px; text-align: center; font-size: 14px; }
    .auth-footer a { color: var(--orange-ink); font-weight: 700; text-decoration: none; }
    .auth-footer a:hover { text-decoration: underline; }
    .banner { padding: 12px 14px; border-radius: 10px; font-size: 14px; margin-bottom: 16px; font-weight: 600; }
    .banner.error { background: #ffebee; color: #c62828; }
    .banner.success { background: #e8f5e9; color: #2e7d32; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="card auth-card">
      <h1 class="brand">Koto <span>Pai?</span></h1>
      <p class="muted">Log in to track outings and settlements.</p>

      <div th:if="${param.error}" class="banner error">
        Invalid username/email or password.
      </div>
      <div th:if="${param.logout}" class="banner success">
        You have been logged out successfully.
      </div>
      <div th:if="${param.registered}" class="banner success">
        Registration successful! Please log in with your credentials.
      </div>

      <form th:action="@{/login}" method="post">
        <div class="form-group">
          <label for="username">Username or Email</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="rafsan10 or you@example.com" required autofocus>
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required>
        </div>

        <button type="submit" class="auth-btn">Log In</button>
      </form>

      <div class="auth-footer">
        Don’t have an account? <a th:href="@{/register}">Sign up</a>
      </div>
    </div>
  </main>
</body>
</html>
