<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Notifications', '', ~{::main})}">
<head>
  <title>Notifications · Koto Pai</title>
</head>
<body>
<main class="page-notifications">
  <div class="head" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 20px;">
    <div>
      <h1>Notifications</h1>
      <p>Stay updated on outings, splits, and settlements.</p>
    </div>
    <form th:if="${unreadCount > 0}" th:action="@{/notifications/read-all}" method="post" style="display: inline;">
      <button type="submit" class="btn sm line" style="font-size: 13px;">Mark all as read</button>
    </form>
  </div>

  <div class="card" th:if="${not #lists.isEmpty(notifications)}" style="padding: 10px 16px;">
    <div th:each="n : ${notifications}"
         class="row"
         style="align-items: center; justify-content: space-between; padding: 14px 4px; border-bottom: 1px solid var(--line);"
         th:styleappend="${!n.read} ? 'background: rgba(24,96,75,0.03); font-weight: 500;' : ''">
      
      <div style="display: flex; align-items: center; gap: 14px; flex: 1;">
        <!-- Notification icon based on type -->
        <div class="av"
             style="width: 40px; height: 40px; font-size: 16px; flex-shrink: 0;"
             th:styleappend="${n.type.name().contains('PAYMENT')} ? 'background: #2B8C67; color: #fff;' : (${n.type.name().contains('OUTING')} ? 'background: #D95D39; color: #fff;' : 'background: var(--teal); color: #fff;')">
          <span th:if="${n.type.name().contains('PAYMENT')}">৳</span>
          <span th:if="${n.type.name().contains('OUTING')}">🍽</span>
          <span th:if="${n.type.name().contains('DEBT')}">⚡</span>
          <span th:if="${n.type.name().contains('FRIEND')}">👥</span>
          <span th:if="${n.type.name().equals('SYSTEM')}">ℹ</span>
        </div>

        <div class="grow">
          <div>
            <a th:if="${n.linkUrl != null}"
               th:href="@{${n.linkUrl}}"
               style="text-decoration: none; color: inherit;"
               th:text="${n.message}">Notification message</a>
            <span th:if="${n.linkUrl == null}" th:text="${n.message}">Notification message</span>
          </div>
          <small style="color: var(--muted); font-size: 12px; display: block; margin-top: 2px;"
                 th:text="${#temporals.format(n.createdAt, 'MMM d, yyyy · HH:mm')}">Nov 24, 2026</small>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span th:if="${!n.read}" class="dot" style="display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--orange);" title="Unread"></span>
        <form th:if="${!n.read}" th:action="@{/notifications/{id}/read(id=${n.id})}" method="post" style="display: inline;">
          <button type="submit" class="btn sm line" style="padding: 4px 8px; font-size: 11px; color: var(--muted);" title="Mark as read">✓</button>
        </form>
      </div>
    </div>
  </div>

  <div class="card empty" th:if="${#lists.isEmpty(notifications)}">
    <p>No notifications yet.</p>
    <small style="color: var(--muted);">You're all caught up!</small>
  </div>
</main>
</body>
</html>
