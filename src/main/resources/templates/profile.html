<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security"
      th:replace="~{layout :: page('Profile', 'profile', ~{::main})}">
<head>
  <title>Profile · Koto Pai</title>
</head>
<body>
<main class="page-profile">
  <div class="head">
    <div>
      <h1>Profile</h1>
    </div>
  </div>

  <div class="card">
    <div class="profile">
      <div class="av"
           th:style="${profile.avatarColor != null} ? 'background-color:' + ${profile.avatarColor} + '; color:#fff;' : ''"
           th:text="${profile.initial}">R</div>
      <b style="font-size: 18px;" th:text="${profile.displayName}">Rafsan</b>
      <span class="help" style="cursor: pointer;" onclick="navigator.clipboard.writeText(this.getAttribute('data-code')); alert('Copied ID: ' + this.getAttribute('data-code'));" th:data-code="${'@' + profile.userCode}">
        <span th:text="${'@' + profile.userCode}">@rafsan10</span> · tap to copy your ID
      </span>
    </div>

    <form th:action="@{/profile}" method="post">
      <label class="field">
        <span>Display name</span>
        <input type="text" name="displayName" th:value="${profile.displayName}" required maxlength="80" autocomplete="name" />
      </label>

      <label class="field">
        <span>Bio</span>
        <input type="text" name="bio" th:value="${profile.bio}" placeholder="Add a short bio..." maxlength="255" />
      </label>

      <label class="field">
        <span>Avatar Color (Hex)</span>
        <input type="text" name="avatarColor" th:value="${profile.avatarColor}" placeholder="#18604B" pattern="^#[0-9a-fA-F]{6}$" title="Must be a 6-character hex color (e.g. #18604B)" />
      </label>

      <button type="submit" class="btn block" style="margin-top: 16px;">Save changes</button>
    </form>
  </div>

  <div class="card" style="margin-top: 12px;">
    <div class="row">
      <div class="grow"><b>Outings</b></div>
      <b th:text="${stats.outingsCount}">12</b>
    </div>
    <div class="row">
      <div class="grow"><b>Friends</b></div>
      <b th:text="${stats.friendsCount}">8</b>
    </div>
    <div class="row">
      <div class="grow"><b>Settled so far</b></div>
      <b th:text="${stats.formattedSettledAmount}">৳14,250</b>
    </div>
  </div>

  <div sec:authorize="hasRole('ADMIN')" style="margin-top: 12px;">
    <a th:href="@{/admin}" class="btn sec2 block" style="width: 100%;">Admin Console</a>
  </div>

  <form th:action="@{/logout}" method="post" style="margin-top: 12px;">
    <button type="submit" class="btn line block" style="width: 100%;">Log out</button>
  </form>
</main>
</body>
</html>
