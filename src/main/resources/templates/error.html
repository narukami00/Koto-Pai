<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org"
      th:replace="~{layout :: page('Something went wrong', '', ~{::main})}">
<head>
  <title>Something went wrong · Koto Pai</title>
</head>
<body>
<main class="dashboard">
  <section class="card error-card">
    <span class="error-code" th:text="${status != null ? status : 'Oops'}">404</span>
    <h1 th:text="${status == 404 ? 'Page not found'
                  : status == 403 ? 'You can’t open this page'
                  : status == 401 ? 'Please log in first'
                  : 'Something went wrong'}">Page not found</h1>
    <p class="muted"
       th:text="${status == 404 ? 'The page you are looking for does not exist or has moved.'
                  : status == 403 ? 'Your account does not have access to this page.'
                  : status == 401 ? 'You need to log in to see this page.'
                  : 'Something broke on our side. Please try again in a moment.'}">
      The page you are looking for does not exist or has moved.
    </p>
    <div class="hero-actions error-actions">
      <a class="btn" th:href="@{/}">Back to home</a>
      <a class="btn sec2" th:if="${navUser == null}" th:href="@{/login}">Log in</a>
    </div>
  </section>
</main>
</body>
</html>
