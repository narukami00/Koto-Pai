spring.application.name=kotopai

# Local secrets live in .env (gitignored). Copy .env.example to .env and fill it in.
spring.config.import=optional:file:.env[.properties]

# --- Database (Supabase PostgreSQL) ---
spring.datasource.url=jdbc:postgresql://${DB_HOST}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
# Each teammate uses their own schema on the shared project (see docs/SUPABASE_SETUP.md)
spring.datasource.hikari.schema=${DB_SCHEMA:public}
spring.datasource.hikari.maximum-pool-size=3

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
