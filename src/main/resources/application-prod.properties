# ==============================================================================
# Production Profile Configuration (PostgreSQL / Docker / Cloud)
# Activate with: -Dspring.profiles.active=prod or SPRING_PROFILES_ACTIVE=prod
# ==============================================================================

spring.application.name=kotopai

# --- Server ---
# Platforms like Render tell the app which port to bind through PORT; locally it stays 8080.
server.port=${PORT:8080}
# Behind a platform's HTTPS proxy, trust X-Forwarded-* so redirects and cookies use https.
server.forward-headers-strategy=framework

# --- Datasource Configuration (PostgreSQL) ---
# Supports container link (e.g. postgres:5432) or cloud provider (Supabase, RDS, etc.)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:kotopai}?sslmode=${DB_SSLMODE:disable}
spring.datasource.username=${DB_USER:kotopai}
spring.datasource.password=${DB_PASSWORD:kotopai_secret}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- HikariCP Connection Pool Settings ---
spring.datasource.hikari.pool-name=KotoPaiHikariCP
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:10}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.schema=${DB_SCHEMA:public}

# --- JPA / Hibernate Settings ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.default_schema=${DB_SCHEMA:public}
spring.jpa.properties.hibernate.format_sql=false

# --- Spring Boot Actuator Endpoints ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# /actuator/prometheus is closed unless a scrape password is set (see MetricsSecurityConfig).
kotopai.metrics.username=${METRICS_USER:prometheus}
kotopai.metrics.password=${METRICS_PASSWORD:}
management.metrics.tags.application=kotopai
# Latency histograms so Grafana can draw p50/p95/p99 response times.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true
management.health.livenessstate.enabled=true
management.health.readinessstate.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.kotopai=INFO
logging.level.org.springframework.security=WARN
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

