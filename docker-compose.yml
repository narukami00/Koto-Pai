services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kotopai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kotopai}
      POSTGRES_USER: ${DB_USER:-kotopai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kotopai_secret}
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - kotopai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kotopai} -d ${DB_NAME:-kotopai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kotopai-network

  # ----------------------------------------------------------------------------
  # Koto-Pai Spring Boot Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kotopai:latest
    container_name: kotopai-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # prod = PostgreSQL settings; demo = also create the demo users and outings on first start.
      # For a real deployment set SPRING_PROFILES_ACTIVE=prod so no demo accounts exist.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,demo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kotopai}
      DB_USER: ${DB_USER:-kotopai}
      DB_PASSWORD: ${DB_PASSWORD:-kotopai_secret}
      DB_SCHEMA: public
      DB_SSLMODE: disable
    ports:
      - "${HOST_APP_PORT:-8080}:8080"
    networks:
      - kotopai-network

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  kotopai_pgdata:
    name: kotopai_pgdata

networks:
  kotopai-network:
    name: kotopai-network

