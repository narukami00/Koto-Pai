services:
  # ----------------------------------------------------------------------------
  # PostgreSQL Database Service
  # ----------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: kotopai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-kotopai}
      POSTGRES_USER: ${DB_USER:-kotopai}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kotopai_secret}
    ports:
      - "${HOST_DB_PORT:-5432}:5432"
    volumes:
      - kotopai_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kotopai} -d ${DB_NAME:-kotopai}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - kotopai-network

  # ----------------------------------------------------------------------------
  # Koto-Pai Spring Boot Application Service
  # ----------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: kotopai:latest
    container_name: kotopai-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # prod = PostgreSQL settings; demo = also create the demo users and outings on first start.
      # For a real deployment set SPRING_PROFILES_ACTIVE=prod so no demo accounts exist.
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod,demo}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-kotopai}
      DB_USER: ${DB_USER:-kotopai}
      DB_PASSWORD: ${DB_PASSWORD:-kotopai_secret}
      DB_SCHEMA: public
      DB_SSLMODE: disable
      # Password Prometheus uses to scrape /actuator/prometheus. Leave it unset in production to keep metrics closed.
      METRICS_PASSWORD: ${METRICS_PASSWORD:-kotopai_metrics}
    ports:
      - "${HOST_APP_PORT:-8080}:8080"
    networks:
      - kotopai-network

  # ----------------------------------------------------------------------------
  # Monitoring (optional): docker compose --profile monitoring up --build
  # Prometheus on http://localhost:9090, Grafana on http://localhost:3000
  # ----------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: kotopai-prometheus
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      METRICS_PASSWORD: ${METRICS_PASSWORD:-kotopai_metrics}
    # The scrape password comes from the environment; write it to a file Prometheus can read at start-up.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '%s' "$$METRICS_PASSWORD" > /tmp/metrics_password &&
        exec /bin/prometheus
        --config.file=/etc/prometheus/prometheus.yml
        --storage.tsdb.path=/prometheus
        --storage.tsdb.retention.time=7d
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - kotopai_prometheus_data:/prometheus
    ports:
      - "${HOST_PROMETHEUS_PORT:-9090}:9090"
    networks:
      - kotopai-network

  grafana:
    image: grafana/grafana:11.3.0
    container_name: kotopai-grafana
    profiles: ["monitoring"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-kotopai_grafana}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - kotopai_grafana_data:/var/lib/grafana
    ports:
      - "${HOST_GRAFANA_PORT:-3000}:3000"
    networks:
      - kotopai-network

# ------------------------------------------------------------------------------
# Persistent Volumes & Networks
# ------------------------------------------------------------------------------
volumes:
  kotopai_pgdata:
    name: kotopai_pgdata
  kotopai_prometheus_data:
    name: kotopai_prometheus_data
  kotopai_grafana_data:
    name: kotopai_grafana_data

networks:
  kotopai-network:
    name: kotopai-network

